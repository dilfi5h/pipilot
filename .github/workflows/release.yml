name: Build & Release APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full clone: versionCode counts commits, versionName is read from the tag
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        # Default packages still include the retired 'tools'; install platform-tools only, leave the rest to AGP
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > pipilot-release.keystore
          echo "$KEYSTORE_PROPERTIES" > keystore.properties

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify signing cert (fail build on mismatch)
        run: |
          CERT=$(./tools/apk-cert-sha256.sh app/build/outputs/apk/debug/app-debug.apk)
          echo "cert sha256: $CERT"
          [ "$CERT" = "380325ded8f9ed0144ec77c022e73b49c1c1661dc6c717e848e9a9e5bdcd6f53" ]

      - name: Rename APK
        run: |
          # A branch name with / cannot be used as a filename (cp treats it as a directory); tags usually have no /, replacement is harmless
          SAFE_REF="${GITHUB_REF_NAME//\//-}"
          cp app/build/outputs/apk/debug/app-debug.apk \
             PiPilot-${SAFE_REF}-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PiPilot-APK
          path: PiPilot-*-debug.apk

      - name: Create GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: PiPilot-*-debug.apk
          generate_release_notes: true
